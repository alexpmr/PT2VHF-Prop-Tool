# GitLab CI/CD - PT2VHF Prop Tool
# Windows installers are retained as pipeline artifacts, not published as releases.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - build
  - publish

node_tests:
  stage: test
  image: node:24-bookworm
  variables:
    ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    npm_config_audit: "false"
    npm_config_fund: "false"
  script:
    - npm ci --no-audit --no-fund
    - node --check scripts/check.mjs
    - npm test
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - npm-debug.log
  timeout: 30m

windows_package:
  stage: build
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
      allow_failure: false
  before_script:
    - 'choco install nodejs-lts -y --no-progress'
    - '$env:PATH = "C:\\Program Files\\nodejs;" + $env:PATH'
    - '$nodeVersion = [int]((node --version).TrimStart("v").Split(".")[0]); if ($nodeVersion -lt 22) { throw "Node.js >=22 required for Electron 44" }'
  script:
    - npm ci --no-audit --no-fund
    - node node_modules/electron/install.js
    # Headless Windows CI cannot capture Electron screenshots reliably.
    # Screenshot/manual refresh runs separately on an interactive Windows machine.
    - '$env:PROP_SKIP_MANUAL_QA = "1"'
    - npm run check
    - npm test
    - '$env:CSC_IDENTITY_AUTO_DISCOVERY = "false"'
    - npm run dist:win
    - '.\\scripts\\smoke-windows.ps1'
    - 'if (-not (Test-Path "dist/latest.yml")) { throw "Update metadata not generated" }'
    - 'if (-not (Test-Path "dist/SHA256SUMS.txt")) { throw "Checksums missing" }'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - dist/*.exe
      - dist/latest.yml
      - dist/SHA256SUMS.txt
  timeout: 90m

# Publishes only after Windows installation, portable runtime, update and rollback QA pass.
# Requires pt2vhf-site CI job token allowlist/push permission for this source project.
release_prop_to_site:
  stage: publish
  image: python:3.12-alpine
  needs:
    - job: windows_package
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  before_script:
    - apk add --no-cache git ca-certificates
  script:
    - set -eu
    - version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
    - 'echo "$version" | grep -Eq "^[0-9]+\\.[0-9]+\\.[0-9]+$"'
    - 'test -s "dist/PT2VHF-Prop-Tool-${version}-x64-setup.exe"'
    - 'test -s "dist/PT2VHF-Prop-Tool-${version}-x64-portable.exe"'
    - 'git clone --depth 1 --branch main "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/pt2vhf-group/pt2vhf-site.git" /tmp/pt2vhf-site'
    - cd /tmp/pt2vhf-site
    - mkdir -p downloads/prop-tool
    - |
      python3 - "$version" <<'PY'
      import json, sys
      from pathlib import Path
      version = sys.argv[1]
      catalog = json.loads(Path("updates.json").read_text(encoding="utf-8"))
      prior = catalog["products"]["prop"].get("version")
      if prior and tuple(map(int, prior.split("."))) > tuple(map(int, version.split("."))):
          sys.exit("Refusing version regression")
      for package in Path("downloads/prop-tool").glob("PT2VHF-Prop-Tool-*-x64-*.exe"):
          package.unlink()
      PY
    - 'cp "$CI_PROJECT_DIR/dist/PT2VHF-Prop-Tool-${version}-x64-setup.exe" downloads/prop-tool/'
    - 'cp "$CI_PROJECT_DIR/dist/PT2VHF-Prop-Tool-${version}-x64-portable.exe" downloads/prop-tool/'
    - python3 scripts/sync_prop_manifest.py --version "$version" --apply
    - |
      python3 - <<'PY'
      import json
      from pathlib import Path
      files = json.loads(Path("updates.json").read_text(encoding="utf-8"))["products"]["prop"]["files"]
      assert len(files) == 2 and {f["kind"] for f in files} == {"portable", "installer"}
      assert all(f["url"].startswith("https://www.pt2vhf.com/downloads/prop-tool/") for f in files)
      assert all(Path("downloads/prop-tool", f["name"]).stat().st_size == f["size"] for f in files)
      PY
    - git add -A downloads/prop-tool updates.json
    - |
      if git diff --cached --quiet; then
        echo "The verified Prop Tool release is already in the site repository."
      else
        git -c user.name="PT2VHF CI" -c user.email="ci@pt2vhf.com" commit -m "release(prop): publish validated Windows v${version}"
        git pull --rebase origin main
        git push origin HEAD:main
        echo "Verified release pushed to official site repository."
      fi
  timeout: 45m
