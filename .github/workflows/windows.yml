name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          npm ci --no-audit --no-fund
      - name: Ensure Electron runtime is downloaded
        run: node node_modules/electron/install.js
      - name: Capture current UI for manual
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\node_modules\electron\dist\electron.exe' -ArgumentList '. --capture-docs' -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Documentation screenshot capture failed: $($process.ExitCode)" }
      - name: Generate current illustrated PDF manual
        run: |
          python -m pip install --disable-pip-version-check pillow reportlab pypdf
          python scripts/make-manual.py
      - name: Validate sources and engine
        run: |
          npm run check
          npm test
      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Add-Content $env:GITHUB_OUTPUT "value=$version"
      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag must match package.json version' }
      - name: Smoke-test Electron and offline map
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\node_modules\electron\dist\electron.exe' -ArgumentList '. --smoke-test' -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Electron smoke test failed: $($process.ExitCode)" }
      - name: Build installer and portable x64
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Validate installed and portable packages
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - name: Include illustrated PDF manual
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "docs/PT2VHF-Prop-Tool-$version-Manual.pdf" dist/
      - name: Generate SHA-256 sums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.pdf' -or $_.Name -eq 'latest.yml' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-Prop-Tool-Windows-x64
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.pdf
            dist/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PT2VHF-Prop-Tool-Windows-x64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          asset_dir=$(find dist -type f -name SHA256SUMS.txt -printf '%h\n')
          test -n "$asset_dir"
          cd "$asset_dir"
          sha256sum --check SHA256SUMS.txt
          test -f "PT2VHF-Prop-Tool-${RELEASE_TAG#v}-x64-setup.exe"
          test -f "PT2VHF-Prop-Tool-${RELEASE_TAG#v}-x64-portable.exe"
          test -f latest.yml
          test -f "PT2VHF-Prop-Tool-${RELEASE_TAG#v}-Manual.pdf"
          current_head=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$current_head" != "$RELEASE_COMMIT" ]; then
            echo "A newer main commit exists; preserve artifacts and let its validated build publish."
            exit 0
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            created=false
            for attempt in 1 2 3 4 5; do
              echo "Creating release $RELEASE_TAG (attempt $attempt/5)"
              if gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --title "PT2VHF Prop Tool $RELEASE_TAG" --generate-notes; then
                created=true
                break
              fi
              sleep $((attempt * 10))
            done
            if [ "$created" != "true" ]; then
              echo "Could not create release after retries."
              exit 1
            fi
          fi
          for asset in ./*.exe ./*.pdf latest.yml SHA256SUMS.txt; do
            name=$(basename "$asset")
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "$name already uploaded."
              continue
            fi
            uploaded=false
            for attempt in 1 2 3 4 5; do
              echo "Uploading $name (attempt $attempt/5)"
              if gh release upload "$RELEASE_TAG" "$asset" --clobber; then
                uploaded=true
                break
              fi
              sleep $((attempt * 10))
            done
            if [ "$uploaded" != "true" ]; then
              echo "Could not upload $name after retries."
              exit 1
            fi
          done
          for asset in ./*.exe ./*.pdf latest.yml SHA256SUMS.txt; do
            name=$(basename "$asset")
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"
          done
          echo "Release $RELEASE_TAG published with all validated assets."
